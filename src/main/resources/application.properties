spring.application.name=prueba-fullstack
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
notification.hablame.enabled=${HABLAME_ENABLED:false}
notification.hablame.url=${HABLAME_URL:https://api101.hablame.co/api/sms/v3/send/marketing}
notification.hablame.customer=${HABLAME_CUSTOMER:}
notification.hablame.api-key=${HABLAME_API_KEY:}
notification.hablame.password=${HABLAME_PASSWORD:}
notification.hablame.username=${HABLAME_USERNAME:}
notification.hablame.flash=${HABLAME_FLASH:true}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
